name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# This workflow runs both API tests and page/UI tests in separate jobs

jobs:
  test:
    name: Run API Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Run tests on Node.js 20 only
        node-version: [20]
        # Run API tests on Chromium only
        browser: [chromium]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run Playwright tests
        env:
          # Set environment variables for CI
          CI: true
          # Add any other environment variables your tests need
          # BASE_URL: ${{ secrets.BASE_URL }}
          # API_KEY: ${{ secrets.API_KEY }}
        # Run API tests from the petstore directory
        run: npx playwright test src/tests/api/petstore/ --project=${{ matrix.browser }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.node-version }}-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 30

      - name: Upload test traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.node-version }}-${{ matrix.browser }}
          path: test-results/
          retention-days: 30

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-report-${{ matrix.node-version }}-${{ matrix.browser }}
          path: playwright-report/index.html
          retention-days: 30

  # Job to run page/UI tests with Chrome
  test-ui:
    name: Run Page Tests with Chrome
    timeout-minutes: 60
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Run tests on Node.js 20 only
        node-version: [20]
        # Run tests on Chromium only
        browser: [chromium]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run Playwright UI tests
        env:
          # Set environment variables for CI
          CI: true
          # Add any other environment variables your tests need
          # BASE_URL: ${{ secrets.BASE_URL }}
          # API_KEY: ${{ secrets.API_KEY }}
        # Run all page/UI tests, excluding API tests
        run: npx playwright test src/tests/ --ignore="src/tests/api/" --project=${{ matrix.browser }}

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-ui-report-${{ matrix.node-version }}-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 30

      - name: Upload UI test traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-ui-traces-${{ matrix.node-version }}-${{ matrix.browser }}
          path: test-results/
          retention-days: 30

      - name: Upload UI HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-ui-html-report-${{ matrix.node-version }}-${{ matrix.browser }}
          path: playwright-report/index.html
          retention-days: 30

  # Job to check code quality
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (if configured)
        run: |
          if [ -f ".eslintrc.js" ] || [ -f ".eslintrc.json" ] || grep -q "eslint" package.json; then
            npx eslint src/ --ext .ts,.js || true
          else
            echo "ESLint not configured"
          fi

      - name: Run Prettier check (if configured)
        run: |
          if [ -f ".prettierrc" ] || [ -f ".prettierrc.json" ] || grep -q "prettier" package.json; then
            npx prettier --check src/ || true
          else
            echo "Prettier not configured"
          fi

      - name: TypeScript type check
        run: |
          if [ -f "tsconfig.json" ]; then
            npx tsc --noEmit || true
          else
            echo "TypeScript config not found"
          fi

  # Job to notify on failure (optional)
  notify:
    name: Notify on Failure
    needs: [test, test-ui, lint]
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Notify on Slack (if configured)
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{"text":"❌ Playwright tests failed on ${{ github.repository }} - ${{ github.sha }}"}' \
            $SLACK_WEBHOOK_URL || true

      - name: Notify on Discord (if configured)
        if: env.DISCORD_WEBHOOK_URL != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{"content":"❌ Playwright tests failed on ${{ github.repository }} - Commit: ${{ github.sha }}"}' \
            $DISCORD_WEBHOOK_URL || true
