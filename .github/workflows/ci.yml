name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test src/tests/api/petstore/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
```

This workflow will:
1. Trigger on push and pull requests to main/master branches
2. Set up Node.js 20 with npm caching
3. Install dependencies using `npm ci`
4. Install Playwright browsers with system dependencies
5. Run all Playwright tests
6. Upload test reports as artifacts for 30 days

To enable this pipeline:
1. Push the `.github/workflows/ci.yml` file to your repository
2. Make sure your repository has GitHub Actions enabled
3. The pipeline will automatically run on the next push or PR

If you need to add environment variables for your tests, you can store them in GitHub Secrets and reference them in the workflow like `${{ secrets.YOUR_SECRET_NAME }}`.
